<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HSC Physics, Chemistry & Higher Math Notes — Bengali & English" />
  <title>HSC Science Notes</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- KaTeX CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
  />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <button class="hamburger" id="hamburger" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
      <a href="#/" class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">HSC Notes</span>
      </a>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <span class="lang-label lang-bn">বাং</span>
        <label class="switch">
          <input type="checkbox" id="langSwitch" />
          <span class="slider"></span>
        </label>
        <span class="lang-label lang-en">EN</span>
      </div>
    </div>
  </header>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- ===== Overlay (mobile) ===== -->
  <div class="overlay" id="overlay"></div>

  <!-- ===== Main Content ===== -->
  <main class="main">
    <article class="content" id="content"></article>
  </main>

  <!-- ===== Scroll-to-top ===== -->
  <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 16V4M10 4L4 10M10 4L16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- ===== Scripts ===== -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
